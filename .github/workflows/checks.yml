name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Restore pinned environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e '.[test,providers,dev]'
          python -m pip check
      - name: Require provider SDKs (prevent silent skips)
        run: python -c "import openai, anthropic, dotenv"
      - name: Lint
        run: python -m ruff check backend
      - name: Tests (simulated providers, no API keys)
        run: python -m pytest -q --tb=short --cov --cov-report=term-missing
      - name: Type-check (LAB-014, etapas 1-5 completas)
        # Las seis etapas del plan por etapas (docs/governance/BACKLOG.md#lab-014)
        # están cerradas: mypy backend/app da 0 errores en los 28 archivos fuente,
        # verificado localmente en macOS (2026-10-13). Primera confirmación
        # cruzada de sistema operativo en este mismo push, vía la matriz de CI.
        run: python -m mypy backend/app
      - name: Dependency vulnerability scan
        # Primera revisión (2026-10-12): 4 CVE reales en pip==26.1 (herramienta de
        # build, no dependencia de runtime); corregido subiendo a pip==26.2.1 y
        # regenerando el lock. Auditoría limpia confirmada; paso bloqueante.
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-dev.lock --strict
