[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-police-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["ruff==0.17.0"]
providers = ["openai>=1.66,<4", "anthropic>=0.49,<1", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Los SDK son opcionales: importorskip debe preceder a sus adaptadores.
"backend/tests/test_m2.py" = ["E402"]
